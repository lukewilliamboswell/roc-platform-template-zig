name: Install the platform toolchain
description: >-
  Install Zig 0.17.0, the tooling compiler as `roc-stable` and the Roc nightly
  this run resolved once, as `roc`, on runners where Blueprint cannot run
  (Windows and Intel macOS) as well as the others.

inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true

runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.17.0
        use-cache: false

    # The tooling compiler that runs scripts/*.roc: the nightly Blueprint.roc
    # fetches as roc-stable, read from there so the two never disagree.
    - id: stable
      shell: bash
      run: |
        tag=$(sed -n 's/.*Fetch("roc-stable", Recipes.roc_nightly("\(nightly-[0-9a-f-]*\)")).*/\1/p' Blueprint.roc)
        test -n "$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ steps.stable.outputs.tag }}

    - name: Keep the tooling compiler as roc-stable
      shell: bash
      run: |
        suffix=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
        source_dir=$(dirname "$(command -v roc)")
        mkdir -p "$RUNNER_TEMP/roc-stable"
        cp -R "$source_dir"/. "$RUNNER_TEMP/roc-stable/"
        mv "$RUNNER_TEMP/roc-stable/roc$suffix" "$RUNNER_TEMP/roc-stable/roc-stable$suffix"
        echo "$RUNNER_TEMP/roc-stable" >> "$GITHUB_PATH"

    # The platform names no compiler: every job of a run installs the one
    # nightly that run resolved, so one run never mixes compilers.
    - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ inputs.nightly-tag }}

    - name: Report the compilers
      shell: bash
      run: |
        echo "roc: $(roc version) ($(command -v roc))"
        echo "roc-stable: $(roc-stable version) ($(command -v roc-stable))"
