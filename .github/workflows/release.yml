name: Release

# A pull request runs every step with the version 0.0.1-dryrun and publishes
# nothing. Dispatching from main with a version publishes the tested files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New platform version, e.g. 1.2.0"
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  RP_AUTOMATION: lukewilliamboswell/roc-automation@8acff758d5d73210f1731bed75adb9322f5e773d
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.1-dryrun' }}

jobs:
  # The platform names no compiler. A release is built and tested with the
  # latest nightly, resolved once here and installed by every job, so the
  # bundle, its tests and the release notes all name one compiler.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - name: Publish only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Release from main"
          exit 1
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  # Build once; the native matrix tests these exact release files over loopback.
  build:
    name: Build and Bundle Platform
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8acff758d5d73210f1731bed75adb9322f5e773d
        with:
          cache: "true"
          cache-workload: dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache/linker-inputs
          key: linker-inputs-${{ runner.os }}-${{ hashFiles('link-inputs.lock.json') }}
      - run: blueprint run fetch-link-inputs
      - run: blueprint run build-release
      - run: blueprint run check
      - run: blueprint run test-host
      - run: blueprint run test-expects
      - run: blueprint run release-test -- test-examples
      - run: blueprint run bundle -- --output-dir .zig-cache/release-platform
      - run: blueprint run release-package -- build "$VERSION" --platform-bundle .zig-cache/release-platform
      - run: blueprint run sbom
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

      - run: |
          blueprint run docs-manual -- --docs-version "$VERSION"
          unzip -q "dist/roc-platform-template-zig-docs-$VERSION.zip" -d .zig-cache/release-api
          cp -R ".zig-cache/release-api/$VERSION" .docs-out/site/api
          touch .docs-out/site/.nojekyll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-preview
          path: .docs-out/site
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .docs-out/site

  # The same archive and bundle, unchanged, on every other release target.
  test-archive:
    name: Test Bundle (${{ matrix.os }})
    needs: [resolve, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-22.04, ubuntu-24.04-arm, windows-2022, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8acff758d5d73210f1731bed75adb9322f5e773d
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - run: blueprint run release-test -- test-archive

  attest:
    name: Attest tested platform bundle
    needs: [build, test-archive]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No source checkout or build commands in the signing job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - id: bundle
        run: |
          sha256sum -c SHA256SUMS
          echo "path=$(ls *.tar.zst)" >> "$GITHUB_OUTPUT"
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}
          sbom-path: platform.spdx.json
      - env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir attestations
          cp "$PROVENANCE" attestations/platform-provenance.sigstore.json
          cp "$SBOM" attestations/platform-sbom.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations
          path: attestations/*
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [resolve, build, attest]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestations
          path: dist
      - name: Verify the signatures
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ needs.resolve.outputs.nightly-tag }}
        run: |
          cd dist
          bundle=$(ls *.tar.zst)
          for kind in provenance sbom; do
            extra=$([ $kind = sbom ] && echo --predicate-type=https://spdx.dev/Document/v2.3 || true)
            gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY" --bundle "platform-$kind.sigstore.json" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main $extra
          done
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@8acff758d5d73210f1731bed75adb9322f5e773d
        with:
          version: ${{ env.VERSION }}
          prerelease: "false"
          notes-file: dist/release-notes.md
          assets: dist/*

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  required:
    name: Bundle required
    if: always()
    needs: [resolve, build, test-archive]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"

  ci-required:
    name: CI required
    if: always()
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success"
