name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false
        type: string
  pull_request:

# Ensure only one release workflow runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-bundle:
    name: Build and Bundle Platform
    runs-on: ubuntu-22.04
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Build platform with ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      - name: Bundle platform
        id: bundle
        run: |
          # Run bundle.sh and capture output
          BUNDLE_OUTPUT=$(./bundle.sh 2>&1)
          echo "$BUNDLE_OUTPUT"

          # Extract the tar.zst filename from "Created: /path/to/HASH.tar.zst" line
          BUNDLE_PATH=$(echo "$BUNDLE_OUTPUT" | grep "^Created:" | awk '{print $2}')
          BUNDLE_FILENAME=$(basename "$BUNDLE_PATH")

          if [ -z "$BUNDLE_FILENAME" ]; then
            echo "Error: Could not extract bundle filename from output"
            echo "Bundle output was:"
            echo "$BUNDLE_OUTPUT"
            exit 1
          fi

          echo "Bundle created: $BUNDLE_FILENAME"
          echo "bundle_filename=$BUNDLE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-bundle
          path: ${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test Bundle
    needs: build-and-bundle
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-15
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
          - windows-2025
          # TODO: re-enable windows-11-arm after https://codeberg.org/ziglang/zig/issues/31865 is fixed.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Download bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-bundle

      - name: Run tests with bundled platform
        run: ci/test_bundled_examples.sh "${{ needs.build-and-bundle.outputs.bundle_filename }}"

  build-docs:
    name: Build Platform Docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Generate docs
        run: |
          roc docs platform/main.roc --output=generated-docs --no-cache
          touch generated-docs/.nojekyll

      - name: Upload docs artifact
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: generated-docs

  create-release:
    name: Create GitHub Release
    needs: [build-and-bundle, test-bundle]
    runs-on: ubuntu-24.04
    # Only run on manual trigger
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-bundle

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_FILE=$(ls *.tar.zst | head -1)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "Error: No bundle file found"
            exit 1
          fi

          # Create release with auto-generated notes
          gh release create "${{ github.event.inputs.release_tag }}" \
            "$BUNDLE_FILE" \
            --title "${{ github.event.inputs.release_tag }}" \
            --generate-notes \
            --notes "Platform bundle built with Zig 0.16.0 and Roc nightly"

          echo "Release created: ${{ github.event.inputs.release_tag }}"
          echo "Bundle uploaded: $BUNDLE_FILE"

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: [build-docs, create-release]
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
