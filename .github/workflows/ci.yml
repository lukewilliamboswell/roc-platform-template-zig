name: CI

on:
  workflow_dispatch:
  pull_request:
  # Squash merges land a commit no PR run validated, so check main itself.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The platform names no compiler; it is tested with the latest nightly. That
  # nightly is resolved once, here, and every job installs that one, so one run
  # never tests two compilers.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  # Everything that runs once, on one machine: the compiler-pin check, the
  # compiled-artifact check, the Roc scripts' tests and formatting, and the
  # Zig sources. Blueprint provides roc-stable and Zig; bare roc is the
  # resolved nightly.
  check:
    name: Checks
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          install-nix: "true"
          cache: "true"
          cache-workload: dev
      - run: blueprint run compiler-version
      - run: blueprint run check

  # Every example, as checked in, against the working tree's platform, on
  # every release target's native runner: check, build and run each case and
  # compare its output exactly with tests/spec.json.
  examples:
    name: Current source (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-15
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-2022
          - windows-2025
          # TODO: re-enable windows-11-arm after https://codeberg.org/ziglang/zig/issues/31865 is fixed.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
      # The cache only saves a download: every use rehashes the archive
      # against the lock, and nothing here can rebuild it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache/linker-inputs
          key: linker-inputs-${{ runner.os }}-${{ hashFiles('link-inputs.lock.json') }}
      - run: zig build fetch-link-inputs
      # Host unit tests, then every example against tests/spec.json.
      - name: Test the host and the examples
        uses: roc-lang/roc/.github/actions/flaky-retry@3d0fdde9ae6ffb5ef411f8c8c2fc2cdce22a74fe
        with:
          command: zig build test
          error_string_contains: "build.zig.zon"

  required:
    name: CI required
    if: always()
    needs: [resolve, check, examples]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all CI jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"
