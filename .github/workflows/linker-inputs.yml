name: Linker inputs

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Attest the exact candidate selected by the trusted publisher
        required: true
        type: boolean
      expected_sha:
        description: Exact pull-request head selected by the trusted publisher
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linker-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Deterministic build (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned normalization and signature tools
        run: |
          PACKAGE=$(python3 -c 'import json; print(json.load(open("runtime/sources.json"))["objcopy"]["package"])')
          sudo apt-get update
          sudo apt-get install -y minisign "$PACKAGE"
      - name: Test archive, inventory, and extraction safety
        run: python3 -m unittest discover -s scripts -p 'test_linker_inputs.py' -v
      - name: Build from verified sources and project-authored interface metadata
        run: python3 scripts/build_linker_inputs.py --output .zig-cache/linker-inputs-dist
      - name: Read version
        id: metadata
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("linker-inputs/sources.json"))["version"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linker-inputs-${{ matrix.copy }}
          path: .zig-cache/linker-inputs-dist/*
          if-no-files-found: error

  reproducibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linker-inputs-*
      - run: diff -r linker-inputs-1 linker-inputs-2

  assemble:
    needs: [build, reproducibility]
    if: inputs.release_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Bind candidate to the publisher-selected commit
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}'}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: linker-inputs-1, path: aggregate}
      - run: python3 scripts/build_input_release.py --source aggregate --output release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release/build-input-release.json
            release/link-inputs-all.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: link-input-release
          path: release/*
          if-no-files-found: error
