name: Linker inputs

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Attest the exact candidate selected by the trusted publisher
        required: true
        type: boolean
      expected_sha:
        description: Exact pull-request head selected by the trusted publisher
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linker-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Deterministic build (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stable
        run: echo "tag=$(sed -n 's/.*Fetch("roc-stable", Recipes.roc_nightly("\(nightly-[0-9a-f-]*\)")).*/\1/p' Blueprint.roc)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.stable.outputs.tag }}
      # The producer scripts run on the tooling compiler Blueprint.roc names.
      - run: ln -s "$(command -v roc)" "$RUNNER_TEMP/roc-stable" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install pinned normalization and signature tools
        run: |
          PACKAGE=$(jq -r .objcopy.package runtime/sources.json)
          sudo apt-get update
          sudo apt-get install -y minisign "$PACKAGE"
      - name: Test archive, inventory, and extraction safety
        run: |
          roc-stable test scripts/src/LinkInputs.roc
          roc-stable test scripts/src/JsonValue.roc
      - name: Build from verified sources and project-authored interface metadata
        run: roc-stable scripts/build_link_inputs.roc -- build --output .zig-cache/linker-inputs-dist
      - name: Read version
        id: metadata
        run: |
          VERSION=$(jq -r .version linker-inputs/sources.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linker-inputs-${{ matrix.copy }}
          path: .zig-cache/linker-inputs-dist/*
          if-no-files-found: error

  reproducibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linker-inputs-*
      - run: diff -r linker-inputs-1 linker-inputs-2

  assemble:
    needs: [build, reproducibility]
    if: inputs.release_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - id: stable
        run: echo "tag=$(sed -n 's/.*Fetch("roc-stable", Recipes.roc_nightly("\(nightly-[0-9a-f-]*\)")).*/\1/p' Blueprint.roc)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.stable.outputs.tag }}
      # The producer scripts run on the tooling compiler Blueprint.roc names.
      - run: ln -s "$(command -v roc)" "$RUNNER_TEMP/roc-stable" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Bind candidate to the publisher-selected commit
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}'}
        run: test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: linker-inputs-1, path: aggregate}
      - run: roc-stable scripts/build_link_inputs.roc -- release --source aggregate --output release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release/build-input-release.json
            release/link-inputs-all.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: link-input-release
          path: release/*
          if-no-files-found: error
